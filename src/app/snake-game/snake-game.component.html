<div class="game-container">
  <h1>Snake Game</h1>

  <!-- Top row: Game fills the row -->
  <div class="top-row">
    <div class="canvas-container" #canvasContainer>
      <canvas #gameCanvas></canvas>
      <!-- Overlays (HTML, not drawn into canvas) -->
      <div class="overlay menu" *ngIf="!gameStarted && !gameOver">
        <div class="panel">
          <h2>Snake Game</h2>
          <p>Use arrow keys • SPACE pause • ENTER restart</p>
          <button (click)="startGameWithButton()">Play</button>
        </div>
      </div>
      <div class="overlay pause" *ngIf="gameStarted && paused && !gameOver">
        <div class="panel">
          <h3>Paused</h3>
          <button (click)="togglePause()">Continue</button>
          <button (click)="resetGame()">Main Menu</button>
        </div>
      </div>
      <div class="overlay gameover" *ngIf="gameOver">
        <div class="panel">
          <h3>Game Over</h3>
          <p>Score: {{ score }}</p>
          <p>Best: {{ bestScore }}</p>
          <button (click)="resetGame()">Main Menu</button>
          <button (click)="restartGame()">Restart</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom row: only How to Play -->
  <div class="bottom-row" #bottomRow>
    <div class="instructions">
      <h3>How to Play?</h3>
      <ul>
        <li>Use <strong>arrow keys</strong> to control the snake</li>
        <li>Press <strong>SPACE</strong> to pause the game</li>
        <li>Press <strong>ENTER</strong> to restart when game is over</li>
      </ul>
    </div>
  </div>

  
</div>
